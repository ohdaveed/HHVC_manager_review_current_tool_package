<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title Block -->
  <text x="40" y="50" font-size="24" font-weight="bold" fill="#001033">SFDS &amp; HHVC Mockup Design System</text>
  <text x="40" y="75" font-size="14" fill="#5f6368">Official tokens and palette for Figma canvas import</text>

  <!-- Brand Ramp -->
  <text x="40" y="125" font-size="16" font-weight="bold" fill="#001033">Brand Palette (OKLCH Interpolated)</text>
  
  <!-- Swatch Row 1 -->
  <g transform="translate(40, 145)">
    <!-- 95 -->
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#ecf2fb" stroke="#dadce0"/>
    <text x="8" y="24" font-size="12" font-weight="bold" fill="#001033">Brand 95</text>
    <text x="8" y="44" font-size="10" fill="#5f6368">#ecf2fb</text>

    <!-- 90 -->
    <rect x="100" y="0" width="90" height="60" rx="6" fill="#dbe6f7" stroke="#dadce0"/>
    <text x="108" y="24" font-size="12" font-weight="bold" fill="#001033">Brand 90</text>
    <text x="108" y="44" font-size="10" fill="#5f6368">#dbe6f7</text>

    <!-- 80 -->
    <rect x="200" y="0" width="90" height="60" rx="6" fill="#b3cbef"/>
    <text x="208" y="24" font-size="12" font-weight="bold" fill="#001033">Brand 80</text>
    <text x="208" y="44" font-size="10" fill="#5f6368">#b3cbef</text>

    <!-- 70 -->
    <rect x="300" y="0" width="90" height="60" rx="6" fill="#8db0e6"/>
    <text x="308" y="24" font-size="12" font-weight="bold" fill="#001033">Brand 70</text>
    <text x="308" y="44" font-size="10" fill="#001033">#8db0e6</text>

    <!-- 60 -->
    <rect x="400" y="0" width="90" height="60" rx="6" fill="#6897de"/>
    <text x="408" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 60</text>
    <text x="408" y="44" font-size="10" fill="#ffffff">#6897de</text>

    <!-- 50 -->
    <rect x="500" y="0" width="90" height="60" rx="6" fill="#4076c9"/>
    <text x="508" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 50</text>
    <text x="508" y="44" font-size="10" fill="#ffffff">#4076c9</text>

    <!-- 40 (Primary Action) -->
    <rect x="600" y="0" width="90" height="60" rx="6" fill="#2a60af"/>
    <text x="608" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 40 *</text>
    <text x="608" y="44" font-size="10" fill="#ffffff">#2a60af (SFDS)</text>

    <!-- 30 -->
    <rect x="700" y="0" width="90" height="60" rx="6" fill="#10438e"/>
    <text x="708" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 30</text>
    <text x="708" y="44" font-size="10" fill="#ffffff">#10438e</text>

    <!-- 20 -->
    <rect x="800" y="0" width="90" height="60" rx="6" fill="#023070"/>
    <text x="808" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 20</text>
    <text x="808" y="44" font-size="10" fill="#ffffff">#023070</text>

    <!-- 10 (Hover / Footer) -->
    <rect x="900" y="0" width="90" height="60" rx="6" fill="#001d4e"/>
    <text x="908" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 10 *</text>
    <text x="908" y="44" font-size="10" fill="#ffffff">#001d4e (Footer)</text>

    <!-- 05 -->
    <rect x="1000" y="0" width="90" height="60" rx="6" fill="#001033"/>
    <text x="1008" y="24" font-size="12" font-weight="bold" fill="#ffffff">Brand 05</text>
    <text x="1008" y="44" font-size="10" fill="#ffffff">#001033</text>
  </g>

  <!-- Status / Badges -->
  <text x="40" y="260" font-size="16" font-weight="bold" fill="#001033">Review Status Badges</text>
  <g transform="translate(40, 280)">
    <!-- Approved -->
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.5"/>
    <circle cx="24" cy="35" r="8" fill="#137333"/>
    <text x="40" y="32" font-size="13" font-weight="bold" fill="#137333">Approved</text>
    <text x="40" y="52" font-size="11" fill="#137333">#137333 on #e6f4ea</text>

    <!-- Needs Changes -->
    <rect x="200" y="0" width="180" height="70" rx="8" fill="#fef7e0" stroke="#feefc3" stroke-width="1.5"/>
    <circle cx="224" cy="35" r="8" fill="#b06000"/>
    <text x="240" y="32" font-size="13" font-weight="bold" fill="#b06000">Needs Changes</text>
    <text x="240" y="52" font-size="11" fill="#b06000">#b06000 on #fef7e0</text>

    <!-- Blocked -->
    <rect x="400" y="0" width="180" height="70" rx="8" fill="#fce8e6" stroke="#fad2cf" stroke-width="1.5"/>
    <circle cx="424" cy="35" r="8" fill="#c5221f"/>
    <text x="440" y="32" font-size="13" font-weight="bold" fill="#c5221f">Blocked</text>
    <text x="440" y="52" font-size="11" fill="#c5221f">#c5221f on #fce8e6</text>

    <!-- Draft -->
    <rect x="600" y="0" width="180" height="70" rx="8" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.5"/>
    <circle cx="624" cy="35" r="8" fill="#5f6368"/>
    <text x="640" y="32" font-size="13" font-weight="bold" fill="#5f6368">Draft / In Progress</text>
    <text x="640" y="52" font-size="11" fill="#5f6368">#5f6368 on #f1f3f4</text>
  </g>

  <!-- Typography & Hierarchy -->
  <text x="40" y="400" font-size="16" font-weight="bold" fill="#001033">Typography System (SFDS)</text>
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="530" height="200" rx="8" fill="#f8f9fa" stroke="#dadce0"/>
    <text x="24" y="40" font-size="26" font-family="'Roboto Slab', serif" font-weight="bold" fill="#001033">Heading 1: Roboto Slab (700)</text>
    <text x="24" y="80" font-size="20" font-family="'Roboto Slab', serif" font-weight="bold" fill="#001033">Heading 2: Roboto Slab (700)</text>
    <text x="24" y="120" font-size="15" font-family="'Roboto Flex', sans-serif" fill="#202124">Body copy: Roboto Flex Regular (400, 16px line-height 1.6)</text>
    <text x="24" y="150" font-size="13" font-family="'Roboto Flex', sans-serif" font-weight="600" fill="#2a60af">Interactive Link: Roboto Flex Semibold (600, #2a60af)</text>
    <text x="24" y="175" font-size="11" font-family="'Roboto Flex', sans-serif" font-weight="bold" fill="#5f6368" letter-spacing="1">EYEBROW LABEL: UPPERCASE 11PX</text>
  </g>

  <!-- Elevation & Spacing -->
  <text x="610" y="400" font-size="16" font-weight="bold" fill="#001033">Elevation &amp; Shadows</text>
  <g transform="translate(610, 420)">
    <!-- Shadow 1 -->
    <rect x="0" y="0" width="150" height="90" rx="8" fill="#ffffff" filter="drop-shadow(0px 1px 3px rgba(0, 29, 78, 0.12))"/>
    <text x="16" y="36" font-size="13" font-weight="bold" fill="#001033">Elevation 1</text>
    <text x="16" y="60" font-size="11" fill="#5f6368">Cards / Chips</text>

    <!-- Shadow 2 -->
    <rect x="175" y="0" width="150" height="90" rx="8" fill="#ffffff" filter="drop-shadow(0px 4px 12px rgba(0, 29, 78, 0.14))"/>
    <text x="191" y="36" font-size="13" font-weight="bold" fill="#001033">Elevation 2</text>
    <text x="191" y="60" font-size="11" fill="#5f6368">Dropdowns / Menus</text>

    <!-- Shadow 3 -->
    <rect x="350" y="0" width="150" height="90" rx="8" fill="#ffffff" filter="drop-shadow(0px 8px 24px rgba(0, 29, 78, 0.18))"/>
    <text x="366" y="36" font-size="13" font-weight="bold" fill="#001033">Elevation 3</text>
    <text x="366" y="60" fill="#5f6368" font-size="11">Modals / Dialogs</text>
  </g>

  <!-- Spacing Ladder -->
  <text x="610" y="550" font-size="16" font-weight="bold" fill="#001033">Spacing Ladder (4px base)</text>
  <g transform="translate(610, 570)">
    <rect x="0" y="0" width="4" height="24" fill="#2a60af"/>
    <text x="0" y="40" font-size="10" fill="#5f6368">4px</text>

    <rect x="25" y="0" width="8" height="24" fill="#2a60af"/>
    <text x="25" y="40" font-size="10" fill="#5f6368">8px</text>

    <rect x="55" y="0" width="12" height="24" fill="#2a60af"/>
    <text x="55" y="40" font-size="10" fill="#5f6368">12px</text>

    <rect x="90" y="0" width="16" height="24" fill="#2a60af"/>
    <text x="90" y="40" font-size="10" fill="#5f6368">16px</text>

    <rect x="130" y="0" width="24" height="24" fill="#2a60af"/>
    <text x="130" y="40" font-size="10" fill="#5f6368">24px</text>

    <rect x="180" y="0" width="32" height="24" fill="#2a60af"/>
    <text x="180" y="40" font-size="10" fill="#5f6368">32px</text>

    <rect x="240" y="0" width="48" height="24" fill="#2a60af"/>
    <text x="240" y="40" font-size="10" fill="#5f6368">48px</text>

    <rect x="315" y="0" width="64" height="24" fill="#2a60af"/>
    <text x="315" y="40" font-size="10" fill="#5f6368">64px</text>
  </g>
</svg>
