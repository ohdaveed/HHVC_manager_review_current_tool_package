# CI for the HHVC manager-review mockup tool.
#
# Mirrors the local pre-commit gauntlet documented in AGENTS.md:
#   format:check  — Prettier is the ONLY linter in this repo (no ESLint/tsc)
#   validate      — Zod schema + business invariants over pages/*.js
#   test          — the Bun unit-test files EXPLICITLY NAMED in package.json's
#                   `test` script (not a glob — an unnamed test file never runs)
#   test:e2e      — the Playwright specs under tests/e2e/
#
# Counts are deliberately not written here. They were "10" and "9" against a
# real 20 and 14, because nothing makes a comment fail when it goes stale.
#
# Unit checks and the (slower, browser-downloading) e2e suite run as separate
# jobs so a formatting or schema failure reports in seconds without waiting on
# a Chromium download, and so a flaky browser run never masks a unit failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, validate, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # js/main.js imports @sfgov/design-system CSS and the third-party
      # libraries for Vite to bundle, and validate/test load pages through
      # node_modules deps (zod, fast-glob, happy-dom).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check (the lint step)
        run: bun run format:check

      - name: Validate page data (Zod schema + invariants)
        run: bun run validate

      # Runs the real Vite production build, so a bundling failure (a bad
      # import path, a missing dependency) is caught here rather than at
      # deploy time. It also doubles as a deploy-integrity check: the
      # workshop-form copy step fails if the committed sub-app dist
      # references assets that were never committed (the "form shell that
      # never hydrates" regression).
      #
      # This runs BEFORE the unit tests, which is worth a sentence because the
      # obvious order is the other way round. One test in
      # tests/review-api-server.test.js asserts that a set-but-empty
      # STATIC_ROOT still serves the real built app, and it can only tell a
      # correct fallback from a broken one if dist/ actually exists. The test
      # skips itself when there is no build, so with the fast order it passed
      # by skipping and the regression it guards went uncovered in CI.
      - name: Vite build + Netlify bundle assembly (deploy-integrity check)
        run: bun run build:netlify

      - name: Unit tests (bun test)
        run: bun run test

      # build:netlify only exercises the default build mode. The single-file
      # export goes through vite-plugin-singlefile with different inlining
      # rules, so a regression there (an asset the plugin cannot inline, a
      # mode-specific config mistake) would otherwise surface only when
      # someone tried to produce the portable HTML for a reviewer.
      - name: Single-file export build
        run: bun run build:singlefile

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e

      # The HTML report (with on-first-retry traces) is the fastest way to
      # debug a red e2e run without reproducing it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
