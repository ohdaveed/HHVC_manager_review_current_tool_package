<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request a mosquito education workshop | SF.gov</title>
    <!-- Task 6 (SFDS colour adoption) repointed css/styles.css's shared rules
         (body, h1-h4, form fields, .eyebrow, .summary, ...) from primitives
         this file used to declare on its own onto css/sfds.css's tokens and
         css/theme.css's semantic layer -- neither of which this sub-app
         loaded before, since it previously only needed what css/styles.css's
         own :root block defined locally. Without these two, every one of
         those colours resolved to nothing here: body rendered transparent
         over black text, confirmed live. Order matches js/main.js's:
         css/sfds.css first (the primitives styles.css/theme.css read),
         css/theme.css last (its dark-mode block must win the cascade). -->
    <link rel="stylesheet" href="/css/sfds.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/ux-improvements.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script type="module" crossorigin src="/forms/mosquito-workshop-request/assets/index-BDATSpe6.js"></script>
    <link rel="stylesheet" crossorigin href="/forms/mosquito-workshop-request/assets/index-DJe9x8T8.css">
  </head>
  <body>
    <div class="form-shell">
      <header class="form-header">
        <div class="eyebrow">HHVC outreach</div>
        <h1>Request a free mosquito education workshop</h1>
        <p class="summary">
          Tell us about your school, summer camp, museum, or science fair event. Healthy Housing and
          Vector Control will follow up about availability.
        </p>
      </header>
      <!--
        A hidden Netlify Forms detection stub used to sit here, mirroring every
        field so Netlify's build crawler would register the form. It is gone
        with Netlify itself: this form has no intake backend and submits
        nowhere, so the stub registered nothing — and it was a SECOND copy of
        the field list, free to drift from the one in src/main.js that actually
        renders. One inventory, in the module that owns it.
      -->
      <main id="app"></main>
    </div>
  </body>
</html>
