# CI for the HHVC manager-review mockup tool.
#
# Mirrors the local pre-commit gauntlet documented in AGENTS.md:
#   format:check  — Prettier is the ONLY linter in this repo (no ESLint/tsc)
#   validate      — Zod schema + business invariants over pages/*.js
#   test          — the Bun unit-test files EXPLICITLY NAMED in package.json's
#                   `test` script (not a glob — an unnamed test file never runs)
#   test:e2e      — the Playwright specs under tests/e2e/
#
# Counts are deliberately not written here. They were "10" and "9" against a
# real 20 and 14, because nothing makes a comment fail when it goes stale.
#
# Both jobs pin Bun from `.bun-version` rather than taking `latest`, and the
# pin is load-bearing: `latest` means the runtime changes under the repo with
# no commit, which is how Bun 1.3.14's dropping of `require()` on an async ESM
# module once made every server-spawning suite fail intermittently — passing or
# failing per run depending on what `latest` resolved to that hour. AGENTS.md
# has described this pin as already in place since 2026-08-15; it was not, on
# either job, until this change. `tests/ci-workflow.test.js` now asserts it,
# because a documented safety property nothing checks is exactly the class of
# claim that rots.
#
# Unit checks and the (slower, browser-downloading) e2e suite run as separate
# jobs so a formatting or schema failure reports in seconds without waiting on
# a Chromium download, and so a flaky browser run never masks a unit failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Format, validate, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # js/main.js imports @sfgov/design-system CSS and the third-party
      # libraries for Vite to bundle, and validate/test load pages through
      # node_modules deps (zod, fast-glob, happy-dom).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check (the lint step)
        run: bun run format:check

      - name: Validate page data (Zod schema + invariants)
        run: bun run validate

      # The instruction docs are canon here — AGENTS.md, CLAUDE.md and
      # .github/copilot-instructions.md are a hand-maintained three-way mirror
      # that three different tools read — and nothing checked their structure
      # until now. The first run found a cross-reference in CLAUDE.md pointing at
      # an anchor that had stopped existing, and an angle-bracket placeholder
      # being parsed as an HTML tag and dropped from the rendered page.
      #
      # The file list is derived from `git ls-files`, not globbed. See
      # build_scripts/lint-docs.js: a glob that stops matching does not fail, it
      # stops checking, and the hand-written globs this replaced were missing
      # more than half the repo's markdown.
      - name: Docs lint (markdownlint)
        run: bun run lint:docs

      # Knip, on the categories that were already clean when it was adopted:
      # an unused FILE, an unused dependency, an unlisted one, or an import
      # that resolves nowhere. Cheap and static, so it sits beside validate
      # rather than after the build.
      #
      # `--include` is doing real work here. Knip also reports unused EXPORTS,
      # and this repo publishes deliberately onto `window.<Namespace>` — the
      # review layers reach each other through globals rather than imports, by
      # design — so Knip reads ~89 of those as unused when they are the
      # architecture. Gating on them would fail the build for following the
      # documented pattern. `bun run lint:dead-code` prints the full report,
      # including that list, as a triage aid rather than a gate.
      - name: Dead code (knip)
        run: bun run lint:dead-code:ci

      # The load-order and layering invariants AGENTS.md documents, as checks:
      # no cycles, the mockup renderer never reaching React or MUI, the
      # import-free base modules staying import-free, pages/*.js entering only
      # through js/core/page-data.js, and js/core/state.js keeping the
      # side-effect import of js/core/page-registry.js that applies the
      # reviewer's page registry before ORIGINAL_DATA is cloned.
      #
      # Every rule was verified against the current graph before being written
      # and mutation-proven afterwards, so this starts green and fails only on
      # a real regression. server.ts is not cruised — see the script comment.
      - name: Architecture rules (dependency-cruiser)
        run: bun run lint:architecture

      # oxlint's core rules. These had never run: .oxlintrc.json sets
      # `"rules": {}` and scopes the anti-slop PLUGIN to server.ts and
      # build_scripts/ai, so the ~600 correctness rules were switched off
      # everywhere, including the browser JS.
      #
      # A separate config, .oxlintrc.ci.json, is what makes this gateable.
      # anti-slop stays a hand-run report — pointed at browser JS its rules
      # argue with this codebase's own mandated `typeof window === 'undefined'`
      # guard, which is why it was narrowed in the first place — and the two
      # stylistic unicorn rules are off, for the same reason the repo already
      # refused anti-slop's opinions.
      - name: JavaScript lint (oxlint core rules)
        run: bun run lint:js

      # Runs the real Vite production build, so a bundling failure (a bad
      # import path, a missing dependency) is caught here rather than at
      # deploy time. It also doubles as a deploy-integrity check: the
      # workshop-form copy step fails if the committed sub-app dist
      # references assets that were never committed (the "form shell that
      # never hydrates" regression).
      #
      # This runs BEFORE the unit tests, which is worth a sentence because the
      # obvious order is the other way round. One test in
      # tests/review-api-server.test.js asserts that a set-but-empty
      # STATIC_ROOT still serves the real built app, and it can only tell a
      # correct fallback from a broken one if dist/ actually exists. The test
      # skips itself when there is no build, so with the fast order it passed
      # by skipping and the regression it guards went uncovered in CI.
      - name: Vite build + deploy bundle assembly (deploy-integrity check)
        run: bun run build:railway

      - name: Unit tests (bun test)
        run: bun run test

      # build:railway only exercises the default build mode. The single-file
      # export goes through vite-plugin-singlefile with different inlining
      # rules, so a regression there (an asset the plugin cannot inline, a
      # mode-specific config mistake) would otherwise surface only when
      # someone tried to produce the portable HTML for a reviewer.
      - name: Single-file export build
        run: bun run build:singlefile

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e

      # The HTML report (with on-first-retry traces) is the fastest way to
      # debug a red e2e run without reproducing it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
