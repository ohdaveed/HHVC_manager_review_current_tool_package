name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.github/*.md'
              - '.github/**/*.md'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/*.md'
              - '!.github/**/*.md'

  docs_only_checks:
    name: Docs-only checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Docs lint (markdownlint)
        run: bun run lint:docs
      - name: Prettier check
        run: bun run format:check

  format_validate_lint:
    name: Format, validate, lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier check (the lint step)
        run: bun run format:check

      - name: Reverted-work check (branch vs main)
        run: bun run check:revert

      - name: Validate page data (Zod schema + invariants)
        run: bun run validate

      - name: Docs lint (markdownlint)
        run: bun run lint:docs

      - name: Dead code (knip)
        run: bun run lint:dead-code:ci

      - name: Architecture rules (dependency-cruiser)
        run: bun run lint:architecture

      - name: JavaScript lint (oxlint core rules)
        run: bun run lint:js

  build_railway:
    name: Build railway bundle
    runs-on: ubuntu-latest
    needs: [format_validate_lint, changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vite build + deploy bundle assembly (deploy-integrity check)
        run: bun run build:railway

      - name: Upload dist artifact for downstream unit tests
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build_singlefile:
    name: Build single-file export
    runs-on: ubuntu-latest
    needs: [format_validate_lint, changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Single-file export build
        run: bun run build:singlefile

  unit:
    name: Unit tests (bun test)
    runs-on: ubuntu-latest
    needs: [build_railway, changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Unit tests (bun test)
        run: bun run test

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: [format_validate_lint, changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', '.bun-version') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
