name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual runs, because for four consecutive commits this workflow produced
  # NO runs at all -- Actions simply stopped creating them -- and with only
  # `push` and `pull_request` triggers there was no way to ask for one. `main`
  # was merged to with the local test suite as the only evidence. An escape
  # hatch that costs one line is worth having before it is needed again.
  #
  # It is deliberately input-less: every job below decides what to run from
  # the event name and the change filter, so a dispatch behaves exactly like a
  # push to `main` and needs nothing typed into a form to be correct.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseding a PR run is free -- nobody needs the result for a commit that
  # is no longer the branch head. Superseding a `main` run destroys the only
  # record of whether that commit of `main` was ever green, and a cancelled
  # run reads as a failed one. Two merges landing within six minutes of each
  # other is routine here, so this is a state the repo reaches on its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `dorny/paths-filter` reads the pull-request files API on `pull_request`
  # runs. Declaring any `permissions` block sets every unlisted scope to
  # `none`, so omitting this leaves the change detector without the access it
  # needs -- and every downstream job gates on its outputs, so the failure
  # takes the whole graph with it.
  pull-requests: read

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter_code.outputs.code }}
      docs: ${{ steps.filter_docs.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      # TWO steps, because `predicate-quantifier` is per-invocation and the
      # two filters need opposite semantics.
      #
      # `code` is a positive pattern narrowed by negations, so every rule has
      # to match or the negations never get a say: under the default `some`,
      # the leading `**` matches a Markdown file on its own and `code` comes
      # back true for a docs-only PR.
      - id: filter_code
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/*.md'
              - '!.github/**/*.md'
      # `docs` is a list of ALTERNATIVES, so it needs the default `some`. No
      # file can match `docs/**` and `.github/**/*.md` at once, so running it
      # with `every` makes `docs` permanently false -- which disables the
      # docs-only path just as thoroughly as the bug above, in the opposite
      # direction.
      - id: filter_docs
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.github/*.md'
              - '.github/**/*.md'
  docs_only_checks:
    name: Docs-only checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    steps:
      # Full history, because `check:revert` below compares this branch
      # against origin/main. On a shallow checkout it cannot resolve the base
      # and RETURNS 0 with a SKIP notice — so the step would run, the job
      # would stay green, and nothing would have been checked.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Docs lint (markdownlint)
        run: bun run lint:docs
      - name: Prettier check
        run: bun run format:check
      # The revert guard lives here too, not only in `format_validate_lint`.
      # It compares THIS BRANCH against origin/main, and docs are exactly what
      # it protects: a docs-only branch can restore a byte-identical
      # superseded revision of README or of the synchronised instruction
      # files, and nothing else on this path would notice. The unit suite
      # covers `check:revert`'s own logic against temporary repositories,
      # which is a different question from running it on the branch at hand.
      - name: Reverted-work check (branch vs main)
        run: bun run check:revert
      # Docs are SOURCE DATA here, not prose, so lint alone does not cover a
      # docs-only change. Thirteen test files read them: `doc-counts` and
      # `doc-claims` check figures against the filesystem, `mirror-consistency`
      # checks AGENTS.md/CLAUDE.md/copilot-instructions against each other,
      # `module-paths` checks that a `js/` path in a doc names a real file, and
      # `karl-blocks` parses docs/karl-export-field-map.md against the panel
      # inventory the exporter types into. Without this a docs-only PR merges
      # with a stale count or a mismatched field map, and only the push to
      # `main` finds out.
      #
      # The WHOLE suite rather than a curated list of those files: a named list
      # is a second inventory of which tests read docs, free to drift from the
      # tests themselves, and the run is ~30s. What this path still skips is
      # the expensive half — both builds and Playwright — which is what it
      # exists to skip.
      #
      # VERIFIED 2026-08-24. `bun run test` runs the same fixed file list as
      # the `unit` job below, and `unit` downloads a built `dist/` first.
      # Exactly ONE test in that list reads build output — `review-api-server`'s
      # "still serves the built application from dist/", which `test.skipIf`s
      # itself when `dist/index.html` is absent. So it SKIPS here rather than
      # failing. (`measure-window-graph.test.js` was the suspected candidate
      # and is not one: it imports source modules and reads no build output.)
      #
      # That skip is left in place deliberately. The assertion is about
      # `STATIC_ROOT` falling back to `dist/` rather than the repo root — a
      # server behaviour no docs-only change can alter — and it runs unskipped
      # in `unit` on every PR that touches code. Building `dist/` here to
      # un-skip one assertion would put a full Vite build on the path that
      # exists precisely to skip the expensive half.
      - name: Unit tests (bun test)
        run: bun run test

  format_validate_lint:
    name: Format, validate, lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Prettier check (the lint step)
        run: bun run format:check

      - name: Reverted-work check (branch vs main)
        run: bun run check:revert

      - name: Validate page data (Zod schema + invariants)
        run: bun run validate

      - name: Docs lint (markdownlint)
        run: bun run lint:docs

      - name: Dead code (knip)
        run: bun run lint:dead-code:ci

      - name: Architecture rules (dependency-cruiser)
        run: bun run lint:architecture

      - name: JavaScript lint (oxlint core rules)
        run: bun run lint:js

  build_railway:
    name: Build railway bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [format_validate_lint, changes]
    # `!failure() && !cancelled()` instead of relying on the implicit
    # `success()` GitHub adds to any `if:` that doesn't reference a status
    # function itself. That implicit success() returns false not just when
    # `format_validate_lint` fails, but also when it's merely SKIPPED (docs-
    # only runs) — a GitHub-acknowledged gap, still open. Right now every job
    # in this chain repeats the identical boolean below, so a skip upstream
    # means the same boolean is false downstream too and it's skipped either
    # way — but that safety is coincidental, not enforced. Spelling out
    # !failure() && !cancelled() here means this job's own condition is what
    # decides whether it runs, not an accident of staying in sync with
    # `format_validate_lint`'s.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Vite build + deploy bundle assembly (deploy-integrity check)
        run: bun run build:railway

      - name: Upload dist artifact for downstream unit tests
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Only consumed within this same run (by `unit`, below). Default
          # retention is 90 days; no reason to pay for that here.
          retention-days: 1

  build_singlefile:
    name: Build single-file export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [format_validate_lint, changes]
    # See build_railway's comment on this condition.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Single-file export build
        run: bun run build:singlefile

  unit:
    name: Unit tests (bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build_railway, changes]
    # See build_railway's comment on this condition.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Download dist artifact from build job
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Unit tests (bun test)
        run: bun run test

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [format_validate_lint, changes]
    # See build_railway's comment on the `!failure() && !cancelled()` half.
    #
    # `!draft` is the half this job carries and the other three do not, and it
    # is safe here only because `on.pull_request.types` includes
    # `ready_for_review`: a skipped required check reads to branch protection
    # as a PASSING one, so a draft PR skipping the six-minute browser suite
    # would look green if nothing re-ran on the way out of draft. It does
    # re-run, so the skip lasts exactly as long as the PR is unmergeable
    # anyway. Do not add `!draft` to another job without checking that trigger
    # is still there.
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') &&
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # THE ONE CHECK BRANCH PROTECTION SHOULD REQUIRE.
  #
  # Every job above is conditionally skipped, and a skipped required check
  # reads to branch protection as a PASSING one -- a GitHub-acknowledged gap
  # that the comments above already work around one job at a time. That
  # makes naming the real jobs as required checks unsafe in both directions:
  # require `Unit tests` and a docs-only PR passes it by never running it;
  # require the docs job and every code PR passes it the same way. There is no
  # stable set to name, because the graph deliberately has two mutually
  # exclusive shapes.
  #
  # This job has no condition but `always()`, so it is the one check that runs
  # on every event and can therefore be required. It fails if ANY job reported
  # `failure` or `cancelled`. Reading `skipped` as acceptable is what makes the
  # two-shape graph expressible, and it is not the hole it looks like: a job
  # skipped because an upstream job failed is `skipped`, but that upstream job
  # is itself `failure` and is caught here.
  #
  # What it genuinely does NOT catch is an `if:` condition edited into never
  # firing -- every job skips, and the gate passes. The second step below
  # closes the worst version of that (nothing checked anything at all);
  # the rest is the residual risk of the pattern, and it is strictly smaller
  # than requiring individual jobs, which has this hole AND no aggregation.
  #
  # A job added above must be added to `needs` here or it is not covered.
  # ---------------------------------------------------------------------------
  ci_ok:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - docs_only_checks
      - format_validate_lint
      - build_railway
      - build_singlefile
      - unit
      - e2e
    steps:
      - name: Require every job to have succeeded or skipped by design
        env:
          # `join` over the object filter gives one space-separated word
          # per job in `needs`, in declaration order.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::A CI job reported '$result'."
                exit 1
                ;;
            esac
          done

      # The tripwire for a change filter that matches nothing. `code` and
      # `docs` are meant to be exhaustive between them, so exactly one of these
      # two jobs runs on every pull request. Both skipping means the graph
      # checked NOTHING and reported green -- which is the failure mode a
      # paths-filtered workflow fails in, and this file has already had the
      # filter wrong in both directions once each.
      - name: Require one of the two check paths to have run
        env:
          DOCS_PATH: ${{ needs.docs_only_checks.result }}
          CODE_PATH: ${{ needs.format_validate_lint.result }}
        run: |
          if [ "$DOCS_PATH" != 'success' ] && [ "$CODE_PATH" != 'success' ]; then
            echo "::error::Neither the docs-only path ($DOCS_PATH) nor the code path ($CODE_PATH) ran; nothing was checked."
            exit 1
          fi
          echo 'CI is green.'
