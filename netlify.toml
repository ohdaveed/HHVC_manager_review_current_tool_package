# Netlify config for the HHVC manager-review mockup (static site, no backend).
# `bun run build:netlify` validates page data, runs the Vite production build
# into dist/, and copies the committed workshop-form sub-app in alongside it.
# The optional /api/review-state sync backend has no runtime here, so a Netlify
# deploy is read-only/no-sync by design.
[build]
  # Bun, not npm. This said `npm run build:netlify` while the comment above it
  # said `bun`, and the repo commits only bun.lock — no package-lock.json. npm
  # therefore resolved every dependency fresh from the `^` ranges in
  # package.json, so the deployed artifact could be built against versions no
  # CI run ever exercised, while CI itself uses `bun install --frozen-lockfile`.
  # A lockfile that governs CI but not production is worse than no lockfile,
  # because it looks like it is doing the job.
  command = "bun run build:netlify"
  publish = "dist"

# No build plugins are declared here, deliberately.
#
# `netlify-plugin-a11y` timed out and failed three consecutive deploy previews
# of a build that succeeds everywhere else — in CI (the "Vite build + Netlify
# bundle assembly" step runs this exact command) and in a clean clone. Its
# v0.0.12 does not expose Pa11y's timeout setting, so there is no configuration
# that would have made it pass.
#
# It could not be removed from this file, because it was never in it: it was
# installed through the Netlify UI, and per Netlify's docs "removing the plugin
# from one does not automatically remove it from the other." A UI-installed
# plugin is disabled only under Project configuration > Build & deploy >
# Build plugins. Adding a DIFFERENT plugin here does not displace it — that was
# tried in 193d00f with `@netlify/plugin-lighthouse` and the deploy failed
# again, since that plugin was also registered without ever being added to
# package.json for Netlify to install.
#
# Accessibility is covered where it can actually gate a merge:
# tests/e2e/accessibility.spec.js runs axe (`wcag2a` + `wcag2aa`) over six
# representative pages in the Playwright job, and that job is required. A
# deploy-time plugin would re-check, more slowly and after the fact, what CI
# has already proven.

# Mirror the security headers served by server.ts in local dev.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
