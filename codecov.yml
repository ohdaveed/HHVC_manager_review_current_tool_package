# Codecov configuration.
#
# Coverage here is a REPORT, never a gate. Two independent things have to be
# true for that to hold, and only one of them lives in `ci.yml`:
#
#   1. The upload step must not fail the `unit` job — `fail_ci_if_error` is
#      left at its default of false there.
#   2. Codecov ALSO posts its own commit statuses (`codecov/project` and
#      `codecov/patch`). Branch protection CAN require these: GitHub
#      requires status CONTEXTS, and an external app's contexts are eligible
#      alongside workflow job names. What they are not is JOBS — so
#      `tests/ci-workflow.test.js`, which parses `ci.yml`, cannot enumerate
#      them, and this repo's "every job in the workflow must also be a
#      required context" rule does not reach them. Nothing here would flag
#      it if one were made required by hand. `informational: true` is what
#      keeps them non-gating, and it is the only thing that does.
#
# Marking both statuses informational is deliberate rather than timid. This
# repo's gates are about correctness — the schema `validate` enforces, the
# invariants the suite asserts, the reachability Knip checks. A ratio is not
# one of those: it moves when a data file is added, and a number that can go
# red for a reason nobody can act on is how a required check gets routinely
# bypassed. Turn either one into a gate on purpose, with a target chosen from
# a measurement, or leave it reporting.
coverage:
  status:
    project:
      default:
        informational: true
        # A docs-only PR skips the `unit` job entirely (see `ci.yml`'s
        # `changes` detector), so no report is uploaded for that commit. The
        # default behaviour would leave the status failing on a PR that could
        # not have affected coverage.
        if_not_found: success
    patch:
      default:
        informational: true
        if_not_found: success

# `tests/helpers/browser-env.js` is the only file under `tests/` that Bun's
# profiler reports — it is the happy-dom harness `bunfig.toml` preloads, not
# a subject under test. Measuring the test harness's own coverage says
# nothing about the code it exists to exercise.
#
# Note what is deliberately NOT ignored: `pages/*.js`. Those 29 files are
# page data rather than logic and score close to 100%, so they lift the
# headline ratio above what the `js/` modules alone would report. That is a
# knob worth turning on purpose if the number is ever used for anything, not
# a default worth setting quietly.
ignore:
  - 'tests/'
